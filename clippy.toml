# أنواع ممنوعة على مستوى المشروع: المال لا يُمثَّل بعدد عائم.
disallowed-types = ["f32", "f64"]
# ملاحظة: قاعدة منع std::process::exit جُرِّبت وأُسقطت — مسار التهيئة (--init-admin)
