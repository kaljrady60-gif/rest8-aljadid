<dialog id="account-dialog" aria-labelledby="account-dialog-title">
<div class="dialog-head">
<div><span class="detail-kicker">المالية / دليل الحسابات</span><h2 id="account-dialog-title">حساب جديد</h2><p>أدخل معلومات الحساب؛ لا ينشئ ذلك رصيدًا أو قيدًا.</p></div><button type="button" class="icon-btn" id="close-account" aria-label="إغلاق"><svg><use href="#i-close"/></svg></button></div>
<form id="account-form">
<div class="account-form-grid"><label>الشركة<select name="company_id" data-help="اختر شركة لإنشاء حساب مستقل؛ غير مسند للتجربة فقط."><option value="">غير مسند — تجريبي</option></select></label><label>رقم الحساب <span>*</span><input name="code" maxlength="30" required data-help="رقم فريد ضمن الشركة المختارة حتى 30 حرفًا أو رقمًا. يُسمح بالنقطة والشرطة."></label><label>اسم الحساب <span>*</span><input name="name" maxlength="100" required data-help="اسم الحساب الذي يظهر في الدليل."></label><label>الحساب الأب<select name="parent_id" data-help="اختياري؛ يجب أن يكون حسابًا رئيسيًا من التصنيف نفسه."><option value="">حساب جذري بلا أب</option></select></label><label>التصنيف<select name="category" data-help="التصنيف المحاسبي للحساب؛ يلزم مطابقته للحساب الأب."><option value="asset">الأصول</option><option value="liability">الالتزامات</option><option value="equity">حقوق الملكية</option><option value="revenue">الإيرادات</option><option value="expense">المصروفات</option></select></label><label>نوع الحساب<select name="kind" data-help="الرئيسي يقبل حسابات فرعية؛ التفصيلي لا يقبلها."><option value="group">رئيسي</option><option value="detail">تفصيلي</option></select></label><label>الطبيعة<select name="nature" data-help="الطبيعة المعتادة للحساب؛ لا يمثل ذلك رصيدًا."><option value="debit">مدين</option><option value="credit">دائن</option></select></label><label>العملة<select name="currency" data-help="عملة الحساب في التجربة؛ إعداد العملات العامة غير منفذ بعد.">{% include "components/currency-options.html" %}</select></label></div><p class="account-form-note">لا يفتح الحساب رصيدًا. لا يوجد رصيد افتتاحي؛ ترتبط المسودات الجديدة بالحسابات، والترحيل اختباري إن فُعّل.</p>
<div id="account-form-error" class="form-message hidden" role="alert"></div>
<div class="dialog-actions"><button type="button" class="ghost-btn" id="cancel-account">إلغاء</button><button type="submit" class="primary-btn">حفظ الحساب</button></div></form></dialog>
