<dialog id="voucher-dialog" aria-labelledby="voucher-dialog-title">
<div class="dialog-head">
<div><span class="detail-kicker">المالية / السندات / مسودة</span><h2 id="voucher-dialog-title">سند جديد</h2><p>تُنشأ مسودة القيد مع السند في معاملة واحدة.</p></div><button type="button" class="icon-btn" id="close-voucher" aria-label="إغلاق"><svg><use href="#i-close"/></svg></button></div>
<form id="voucher-form">
<div class="voucher-form-grid"><label>تاريخ السند <span>*</span><input name="date" type="date" required data-help="تاريخ السند والقيد المرتبط."></label><label>العملة <span>*</span><select name="currency" data-help="عملة السند والحسابين؛ لا يتم تحويل العملات.">{% include "components/currency-options.html" %}</select></label><label>اسم الطرف <span>*</span><input name="party_name" maxlength="120" required placeholder="اسم المستلم أو الدافع" data-help="اسم وصفي؛ لا يرتبط بملف عميل أو مورد."></label><label>المبلغ <span>*</span><input name="amount" required inputmode="decimal" maxlength="30" dir="ltr" placeholder="0.00" data-help="قيمة موجبة باستخدام الأرقام الغربية والنقطة، حتى أربع منازل عشرية."></label><label>حساب النقدية <span>*</span><select name="cash_account_id" required data-help="اختر حسابًا تفصيليًا بنفس العملة؛ لا يوجد تصنيف صناديق أو بنوك بعد."></select></label><label>الحساب المقابل <span>*</span><select name="other_account_id" required data-help="حساب تفصيلي آخر من دليل الحسابات وبالعملة نفسها."></select></label><label class="voucher-wide">البيان <span>*</span><input name="description" maxlength="200" required placeholder="سبب العملية" data-help="بيان يظهر في القيد المرتبط."></label><label class="voucher-wide">المرجع<input name="reference" maxlength="100" placeholder="رقم مرجعي اختياري" data-help="مرجع وصفي اختياري، لا يرتبط بمستند آخر."></label></div><p id="voucher-account-notice" class="voucher-notice hidden" role="status"></p>
<div class="form-note" id="voucher-direction"></div>
<div id="voucher-form-error" class="form-message hidden" role="alert"></div>
<div class="dialog-actions"><button type="button" class="ghost-btn" id="cancel-voucher">إلغاء</button><button type="submit" class="primary-btn">حفظ المسودة والقيد</button></div></form></dialog>
